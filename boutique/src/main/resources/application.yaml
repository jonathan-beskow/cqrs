spring:
  application:
    name: boutique

  rabbitmq:
    host: 127.0.0.1
    port: 5673
    username: user
    password: password

  datasource:
    url: jdbc:postgresql://localhost:3334/beautique
    username: beautique
    password: beautique
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        default_schema: beautique_schema

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: beautique_schema
    default-schema: beautique_schema
    baseline-on-migrate: true

server:
  servlet:
    context-path: /ms-beautique
  port: 8082

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG