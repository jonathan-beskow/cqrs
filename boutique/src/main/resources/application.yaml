spring:
  application:
    name: boutique

  datasource:
    url: jdbc:postgresql://localhost:3334/beautique
    username: beautique
    password: beautique
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: beautique_schema

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: beautique_schema
    default-schema: beautique_schema
    baseline-on-migrate: true

server:
  servlet:
    context-path: /ms-beautique
  port: 8082

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG