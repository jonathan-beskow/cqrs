services:
  postgres-beautique:
    image: postgres:17
    hostname: postgres-beautique
    environment:
      POSTGRES_DB: beautique
      POSTGRES_USER: beautique
      POSTGRES_PASSWORD: beautique
    volumes:
      - "D:/db-beautique:/var/lib/postgresql/data"
      - "./init-beautique-schema.sql:/docker-entrypoint-initdb.d/init-beautique-schema.sql"
    ports:
      - "3334:5432"
    networks:
      - beautique-network

  rabbitmq:
    image: "rabbitmq:3-management"
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "5673:5672"
      - "15673:15672"
    networks:
      - beautique-network
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - rabbitmq-log:/var/log/rabbitmq

  mongodb:
    image: "mongo:latest"
    hostname: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: mongopassword
    volumes:
      - "D:/db-mongo:/data/db"
      - "./mongo-init.sh:/docker-entrypoint-initdb.d/mongo-init.sh"
    ports:
      - "27017:27017"
    networks:
      - beautique-network

networks:
  beautique-network:
    driver: bridge

volumes:
  rabbitmq-data:
  rabbitmq-log: